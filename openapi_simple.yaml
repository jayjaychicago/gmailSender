openapi: 3.0.3
info:
  title: Gmail API - Send Email
  description: |
    Send email as the signed-in user.

    Give the recipient, subject and body as ordinary fields. They are assembled
    into an RFC 2822 message and encoded for delivery on the way through — there
    is nothing to format or encode yourself.
  version: "v1"
  contact:
    name: Google Gmail API
    url: https://developers.google.com/gmail/api
  license:
    name: Google APIs Terms of Service
    url: https://developers.google.com/terms

servers:
  - url: https://gmail.googleapis.com
    description: Gmail API production server

security:
  - BearerAuth: []

paths:
  /gmail/v1/users/me/messages/send:
    post:
      summary: Send an email message
      description: |
        Sends an email from the signed-in user's own address.
      operationId: sendMessage
      tags:
        - Messages
      requestBody:
        required: true
        description: |
          Who the mail goes to, what it is about, and what it says. Plain text —
          no headers to write, no base64 to produce.
        content:
          application/json:
            schema:
              type: object
              required: [recipient, subject, body]
              properties:
                recipient:
                  type: string
                  description: |
                    The recipient's email address, e.g. "alice@example.com".
                    A single address — this becomes the To: header.
                  example: "alice@example.com"
                subject:
                  type: string
                  description: The subject line, as plain text.
                  example: "Lunch?"
                body:
                  type: string
                  description: |
                    The message text. Plain text; write it as you would type it,
                    newlines and all.
                  example: "Are you free at 1pm?"
            examples:
              simple_email:
                summary: A short plain-text email
                value:
                  recipient: "alice@example.com"
                  subject: "Lunch?"
                  body: "Are you free at 1pm?"
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                description: A Gmail message
                properties:
                  id:
                    type: string
                    description: The immutable ID of the message
                    example: "1234567890abcdef"
                  threadId:
                    type: string
                    description: The ID of the thread the message belongs to
                    example: "1234567890abcdef"
                  labelIds:
                    type: array
                    items:
                      type: string
                    description: List of IDs of labels applied to this message
                    example: ["SENT"]
              example:
                id: "1234567890abcdef"
                threadId: "1234567890abcdef"
                labelIds: ["SENT"]
        '400':
          description: Bad Request - Invalid request format or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: 400
                  message: "Recipient address required"
                  status: "INVALID_ARGUMENT"
        '401':
          description: Unauthorized - Invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: 403
                  message: "Insufficient Permission: Request had insufficient authentication scopes"
                  status: "PERMISSION_DENIED"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Present the token you receive when you sign in to this API's developer
        portal. Your Google authorization is applied on your behalf, so the call
        runs as you.

  schemas:
    Error:
      type: object
      description: Error response from Gmail API
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              description: HTTP status code
              example: 400
            message:
              type: string
              description: Error message
              example: "Recipient address required"
            status:
              type: string
              description: Error status
              example: "INVALID_ARGUMENT"
            details:
              type: array
              items:
                type: object
              description: Additional error details
